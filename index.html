<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IGCSE Chinese: 相似字 Interactive Worksheet</title>
    <!-- Load Noto Sans SC so the Chinese characters render in a proper CJK
         font instead of falling back to a system font. -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Noto Sans SC', Arial, sans-serif;
            margin: 20px;
            line-height: 1.6;
            background-color: #f4f4f4;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        h1 {
            text-align: center;
            color: #2c3e50;
        }
        #progress {
            text-align: center;
            font-size: 16px;
            margin-bottom: 20px;
            color: #555;
        }
        .question p {
            font-size: 20px;
            margin-bottom: 16px;
            text-align: center;
        }
        .choices {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 12px;
        }
        .choices button {
            font-size: 30px;
            min-width: 72px;
            min-height: 64px;
            padding: 10px 18px;
            cursor: pointer;
            border: 2px solid transparent;
            border-radius: 10px;
            background-color: #3498db;
            color: white;
            transition: background-color 0.2s, transform 0.1s;
        }
        .choices button:hover:not(:disabled) {
            background-color: #2980b9;
        }
        .choices button:active:not(:disabled) {
            transform: scale(0.96);
        }
        .choices button:disabled {
            cursor: default;
        }
        .choices button.chosen-correct {
            background-color: #2ecc71;
        }
        .choices button.chosen-wrong {
            background-color: #e74c3c;
        }
        #feedback {
            margin-top: 16px;
            padding: 12px;
            border-radius: 5px;
            display: none;
            font-size: 16px;
        }
        .correct {
            background-color: #dff0d8;
            color: #3c763d;
        }
        .incorrect {
            background-color: #f2dede;
            color: #a94442;
        }
        #nextBtn {
            display: none;
            margin: 20px auto 0;
            padding: 12px 28px;
            font-size: 16px;
            cursor: pointer;
            border: none;
            border-radius: 5px;
            background-color: #2ecc71;
            color: white;
        }
        #nextBtn:hover {
            background-color: #27ae60;
        }
        /* Final score screen */
        #result {
            display: none;
            text-align: center;
            padding: 20px 10px;
        }
        #result h2 {
            color: #2c3e50;
            margin-bottom: 8px;
        }
        #scoreLine {
            font-size: 40px;
            font-weight: 700;
            color: #2ecc71;
            margin: 12px 0;
        }
        #scoreMessage {
            font-size: 18px;
            color: #555;
            margin-bottom: 24px;
        }
        #tryAgainBtn {
            padding: 12px 32px;
            font-size: 18px;
            cursor: pointer;
            border: none;
            border-radius: 8px;
            background-color: #3498db;
            color: white;
        }
        #tryAgainBtn:hover {
            background-color: #2980b9;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>IGCSE Chinese: 相似字 Interactive Worksheet</h1>
        <p style="text-align: center;">Choose the correct 相似字 to complete each sentence. You must answer correctly to proceed.</p>

        <!-- Quiz view -->
        <div id="quiz">
            <div id="progress"></div>
            <div id="question" class="question"></div>
            <div id="feedback"></div>
            <button id="nextBtn" onclick="nextQuestion()">Next Question</button>
        </div>

        <!-- Final score view -->
        <div id="result">
            <h2>测验完成！ Quiz Complete</h2>
            <div id="scoreLine"></div>
            <p id="scoreMessage"></p>
            <button id="tryAgainBtn" onclick="restartQuiz()">Try Again</button>
        </div>
    </div>

    <script>
        // Question bank. Each question stores its correct answer and three
        // similar-character distractors here in JS — not inline in the buttons —
        // so the answer key isn't trivially visible in the markup.
        const questions = [
            {
                sentence: '我每天早上都会（ ＿ ）习跑步来保持健康。',
                answer: '练',
                choices: ['练', '链', '炼', '拣'],
                explanation: '正确！“练”指练习，如“练习跑步”。“链”指链条，如“自行车链条”。'
            },
            {
                sentence: '这本书的内容非常（ ＿ ）刻，值得一读。',
                answer: '深',
                choices: ['深', '婶', '探', '渗'],
                explanation: '正确！“深”指深刻，如“内容深刻”。“婶”指婶婶，如“我的婶婶”。'
            },
            {
                sentence: '他用（ ＿ ）子把箱子绑得紧紧的。',
                answer: '绳',
                choices: ['绳', '升', '蝇', '绅'],
                explanation: '正确！“绳”指绳子，如“用绳子绑”。“升”指上升或容量单位，如“温度上升”。'
            },
            {
                sentence: '这场比赛的（ ＿ ）果让大家都感到意外。',
                answer: '结',
                choices: ['结', '洁', '桔', '拮'],
                explanation: '正确！“结”指结果，如“比赛结果”。“洁”指干净，如“清洁房间”。'
            },
            {
                sentence: '她喜欢在（ ＿ ）暇时间画画。',
                answer: '闲',
                choices: ['闲', '娴', '间', '闷'],
                explanation: '正确！“闲”指空闲，如“闲暇时间”。“娴”指熟练，如“技艺娴熟”。'
            },
            {
                sentence: '我们需要（ ＿ ）护环境，减少污染。',
                answer: '保',
                choices: ['保', '抱', '堡', '葆'],
                explanation: '正确！“保”指保护，如“保护环境”。“抱”指拥抱，如“抱住孩子”。'
            },
            {
                sentence: '这件衣服的（ ＿ ）量非常好，穿起来很舒服。',
                answer: '质',
                choices: ['质', '志', '贡', '贞'],
                explanation: '正确！“质”指质量，如“衣服质量”。“志”指志向，如“远大志向”。'
            },
            {
                sentence: '他（ ＿ ）续努力，终于实现了自己的目标。',
                answer: '继',
                choices: ['继', '季', '维', '断'],
                explanation: '正确！“继”指继续，如“继续努力”。“季”指季节，如“秋季”。'
            },
            {
                sentence: '这个城市的（ ＿ ）色非常美丽，吸引了很多游客。',
                answer: '景',
                choices: ['景', '境', '影', '憬'],
                explanation: '正确！“景”指景色，如“美丽景色”。“境”指环境或境界，如“生活环境”。'
            },
            {
                sentence: '老师鼓励我们要（ ＿ ）极参与课堂讨论。',
                answer: '积',
                choices: ['积', '稽', '织', '帜'],
                explanation: '正确！“积”指积极，如“积极参与”。“稽”指滑稽或考查，如“滑稽表演”。'
            }
        ];

        const totalQuestions = questions.length;
        let current = 0;       // index of the current question
        let score = 0;         // number answered correctly on the first try
        let firstTry = true;   // has the current question been answered wrong yet?
        let solved = false;    // has the current question been answered correctly?

        // Fisher–Yates shuffle so the correct answer isn't always in the same spot.
        function shuffle(arr) {
            const a = arr.slice();
            for (let i = a.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [a[i], a[j]] = [a[j], a[i]];
            }
            return a;
        }

        function renderQuestion() {
            firstTry = true;
            solved = false;

            const q = questions[current];
            document.getElementById('progress').innerText = `Question ${current + 1} of ${totalQuestions}`;

            const questionDiv = document.getElementById('question');
            questionDiv.innerHTML = '';

            const p = document.createElement('p');
            p.textContent = q.sentence;
            questionDiv.appendChild(p);

            const choicesDiv = document.createElement('div');
            choicesDiv.className = 'choices';
            shuffle(q.choices).forEach(char => {
                const btn = document.createElement('button');
                btn.textContent = char;
                btn.onclick = () => selectAnswer(btn, char);
                choicesDiv.appendChild(btn);
            });
            questionDiv.appendChild(choicesDiv);

            const feedback = document.getElementById('feedback');
            feedback.style.display = 'none';
            feedback.className = '';
            document.getElementById('nextBtn').style.display = 'none';
        }

        function selectAnswer(btn, char) {
            const q = questions[current];
            const feedback = document.getElementById('feedback');
            feedback.style.display = 'block';

            if (char === q.answer) {
                if (firstTry) score++;          // only the first attempt counts
                solved = true;
                feedback.className = 'correct';
                feedback.innerHTML = q.explanation;
                btn.classList.add('chosen-correct');
                // Lock all choices once answered correctly.
                document.querySelectorAll('#question .choices button').forEach(b => b.disabled = true);
                document.getElementById('nextBtn').style.display = 'block';
            } else {
                firstTry = false;
                feedback.className = 'incorrect';
                feedback.innerHTML = '错误！请重新选择正确的字。';
                btn.classList.add('chosen-wrong');
                btn.disabled = true;            // disable just the wrong choice, let them retry
            }
        }

        function nextQuestion() {
            if (current < totalQuestions - 1) {
                current++;
                renderQuestion();
            } else {
                showResult();
            }
        }

        function showResult() {
            document.getElementById('quiz').style.display = 'none';
            const result = document.getElementById('result');
            result.style.display = 'block';

            const pct = Math.round((score / totalQuestions) * 100);
            document.getElementById('scoreLine').innerText = `${score} / ${totalQuestions}`;

            let message;
            if (score === totalQuestions) {
                message = `满分！太棒了！You mastered all the 相似字. (${pct}%)`;
            } else if (pct >= 70) {
                message = `做得好！Good work — keep practising the tricky ones. (${pct}%)`;
            } else {
                message = `继续加油！Review the characters and try again. (${pct}%)`;
            }
            document.getElementById('scoreMessage').innerText = message;
        }

        function restartQuiz() {
            current = 0;
            score = 0;
            document.getElementById('result').style.display = 'none';
            document.getElementById('quiz').style.display = 'block';
            renderQuestion();
        }

        // Start
        renderQuestion();
    </script>
</body>
</html>
